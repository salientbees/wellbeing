version: 0.1.0+1
environment:
  sdk: ">=3.13.3 <4.0.0"
  flutter: ">=3.47.4"
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.4.3
  go_router: 18.0.1
  drift: 2.35.0
  sqlite3: 3.6.0
  cryptography: 2.9.0
  flutter_secure_storage: 11.2.0
  path_provider: 2.1.6
